# Cấu hình Docker Compose chuẩn hóa cho RetailCore (SQL Server 2022 + Spring Boot + React + Observability)
# Sẽ được kích hoạt đầy đủ khi triển khai Milestone 5 – Milestone 8.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: retailcore-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RetailCore@StrongPass2026!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-RetailCore@StrongPass2026!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

